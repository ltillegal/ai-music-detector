[project]
name = "ai-music-detector"
version = "0.1.0"
description = "Desktop app and CLI for detecting AI-generated music with ArtifactNet, SONICS and lofcz"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "onnxruntime>=1.30.0",
    "pyside6>=6.11.2",
    "scipy>=1.11.0",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[project.scripts]
ai-music-detector = "ai_music_detector:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nuitka>=4.2.1",
    "ordered-set>=4.1.0",
    "pytest>=9.1.1",
    "ruff>=0.9.0",
    "zstandard>=0.25.0",
]
# Heavy dependencies ONLY for re-exporting the SONICS ONNX models
# (tools/export_sonics_onnx.py). Normal use, tests and CI do not need them:
# the detector runs on onnxruntime with the prebuilt .onnx files.
export = [
    "onnx>=1.16",
    "torch>=2.4",
    "torchaudio>=2.4",
    "torchvision",
    "timm>=1.0.7",
    "fvcore>=0.1.5",
    "sonics @ git+https://github.com/awsaf49/sonics.git",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Deliberately broad `except Exception` in the detectors: an optional signal
# must not break the main result (ArtifactNet/SONICS/lofcz and progress callback).
ignore = ["E501", "BLE001"]

[tool.uv]
# Keep the default install lean: dev tools are requested explicitly with
# `uv sync --group dev` in CI and packaging docs.
default-groups = []

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
