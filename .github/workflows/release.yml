name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach assets to (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Smoke test sources
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python app.py --smoke-test

      - name: Deploy .app (nuitka onefile)
        run: uv run pyside6-deploy app.py

      - name: Locate built bundle
        id: bundle
        run: |
          ls -la release/
          APP=$(find release -maxdepth 2 -name "*.app" -print -quit)
          if [[ -z "$APP" ]]; then
            echo "::warning::No .app bundle produced (nuitka onefile may emit a bare binary) - falling back to .zip"
            echo "kind=zip" >> "$GITHUB_OUTPUT"
          else
            echo "kind=app" >> "$GITHUB_OUTPUT"
            echo "app=$APP" >> "$GITHUB_OUTPUT"
          fi

      - name: Ad-hoc codesign the bundle
        if: steps.bundle.outputs.kind == 'app'
        run: |
          set -euo pipefail
          codesign --force --deep --sign - "${{ steps.bundle.outputs.app }}"
          codesign --verify --deep --strict "${{ steps.bundle.outputs.app }}"

      - name: Package .dmg
        if: steps.bundle.outputs.kind == 'app'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -n "${{ inputs.tag }}" ]]; then VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"; fi
          ditto --noextattr --noqtn "${{ steps.bundle.outputs.app }}" "AI Music Detector.app"
          hdiutil create -volname "AI Music Detector" \
            -srcfolder "AI Music Detector.app" \
            -ov -format UDZO \
            "AI-Music-Detector-${VERSION}-macos.dmg"
          ls -lh *.dmg

      - name: Package .zip (fallback)
        if: steps.bundle.outputs.kind == 'zip'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -n "${{ inputs.tag }}" ]]; then VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"; fi
          ditto -c -k --keepParent release "AI-Music-Detector-${VERSION}-macos.zip"

      - name: Checksum assets
        id: checksum
        run: |
          set -euo pipefail
          ASSET=$(find . -maxdepth 1 -type f \
            \( -name 'AI-Music-Detector-*-macos.dmg' -o -name 'AI-Music-Detector-*-macos.zip' \) \
            -print -quit)
          test -n "$ASSET"
          BASENAME=$(basename "$ASSET")
          shasum -a 256 "$BASENAME" > "$BASENAME.sha256"
          shasum -a 256 -c "$BASENAME.sha256"
          echo "asset=$BASENAME" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.checksum.outputs.asset }}
            ${{ steps.checksum.outputs.asset }}.sha256
