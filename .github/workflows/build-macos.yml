name: Build macOS .app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: uv sync
        run: uv sync

      - name: Ensure Nuitka dependencies
        run: uv add --dev nuitka ordered_set zstandard

      - name: Deploy .app
        run: uv run pyside6-deploy app.py

      - name: Verify release output
        run: ls -la release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-music-detector-macos
          path: release/